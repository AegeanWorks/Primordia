[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
name = "primordia"
version = "1.1.0"
description = "A zero-dependency evolution sandbox: genomes, selection, speciation and a fossil record"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aegean-E", email = "aegean-licensing@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
primordia = "primordia.cli:main"
