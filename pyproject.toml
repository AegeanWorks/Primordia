[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
license = { text = "AGPL-3.0-or-later" }
name = "primordia"
version = "1.0.6"
description = "A zero-dependency evolution sandbox: genomes, selection, speciation and a fossil record"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aegean-E", email = "aegean-licensing@proton.me" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

[project.scripts]
primordia = "primordia.cli:main"
