  <text x="152" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#fbbf24">PR</text>
  <text x="300" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">Primordia</text>
  <text x="300" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">Primordia is a zero-dependency evolution sandbox:</text><text x="300" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">seed a biosphere, run its clock, and watch genomes</text><text x="300" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#f8fafc" fill-opacity="0.78">vary, compete and speciate. A run replays exactly</text>
