<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Primordia social preview</title>
  <desc id="desc">Primordia is a zero-dependency evolution sandbox: seed a biosphere, run its clock, and watch genomes vary, compete and speciate. A run replays exactly from its seed, and a fossil record keeps the story of what happened.</desc>
